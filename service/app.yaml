runtime: python
env: flex
entrypoint: gunicorn -k eventlet -w 1 -b :$PORT main:app

runtime_config:
  operating_system: ubuntu22
  runtime_version: "3.11"

resources:
  cpu: 1
  memory_gb: 1
  disk_size_gb: 10

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 5
  cool_down_period_sec: 120
  cpu_utilization:
    target_utilization: 0.65

env_variables:
  FLASK_ENV: "production"
  # Secrets are injected at runtime via Secret Manager — do not put real values here
  SECRET_MANAGER_PROJECT: "great-people-495704"

liveness_check:
  path: "/healthz"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 3
  success_threshold: 2

readiness_check:
  path: "/healthz"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: 300
