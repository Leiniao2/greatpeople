steps:
  - name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r requirements.txt
        python -m pytest tests/ -v

  - name: gcr.io/cloud-builders/gcloud
    args:
      - app
      - deploy
      - app.yaml
      - --quiet
      - --project=$PROJECT_ID

timeout: 1200s
